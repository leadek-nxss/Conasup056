<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Conasup</title>
<style>
*{box-sizing:border-box}

.videos{flex:1;display:flex;flex-direction:column;gap:6px;padding:6px;overflow:hidden;min-height:0}
.vid{flex:1;position:relative;border-radius:16px;overflow:hidden;background:#111;border:1px solid #252538;min-height:0}
.vid video{width:100%;height:100%;object-fit:cover}

#next{background:#8a2be2;color:#fff}
#stop{background:#222233;color:#aaa;border:1px solid #333}
#stop.active{background:#ff2e2e;color:#fff}
</style>
</head><body>

</div>
