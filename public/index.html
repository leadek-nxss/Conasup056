<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conasup056 - Chat Aleatorio</title>
<style>
body{margin:0;background:#111;color:white;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}
#top{padding:10px;background:#1a1a1a;text-align:center}
#videos{flex:1;display:flex;gap:10px;padding:10px}
video{flex:1;background:#222;border-radius:12px;object-fit:cover}
#controls{padding:15px;display:flex;gap:10px;justify-content:center;background:#1a1a1a}
button{padding:12px 25px;border:0;border-radius:25px;font-weight:bold;cursor:pointer}
#next{background:#00ff88;color:#000} #stop{background:#ff3b3b;color:#fff}
#status{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);padding:6px 12px;border-radius:20px;font-size:13px}
</style>
</head>
<body>
<div id="top">🟢 Conexión Segura y Aleatoria - Conasup056</div>
<div id="status">Iniciando cámara...</div>
<div id="videos">
<video id="local" autoplay muted playsinline></video>
<video id="remote" autoplay playsinline></video>
</div>
<div id="controls">
<button id="stop">⏹ Parar</button>
<button id="next">⏩ Siguiente</button>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const localVideo = document.getElementById('local');
const remoteVideo = document.getElementById('remote');
const status = document.getElementById('status');
let pc, localStream;

async function init(){
  localStream = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  localVideo.srcObject = localStream;
  status.textContent = "Buscando siguiente...";
  socket.emit('ready');
}

function createPC(){
  pc = new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
  localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  pc.onicecandidate = e=>{ if(e.candidate) socket.emit('ice', e.candidate); };
  pc.ontrack = e=>{ remoteVideo.srcObject = e.streams[0]; status.textContent="✅ Conectado"; };
}

socket.on('matched', async ()=>{
  status.textContent="Conectando...";
  createPC();
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.emit('offer', offer);
});

socket.on('offer', async (offer)=>{
  createPC();
  await pc.setRemoteDescription(offer);
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  socket.emit('answer', answer);
});

socket.on('answer', async (answer)=>{
  await pc.setRemoteDescription(answer);
});

socket.on('ice', async (c)=>{
  if(pc) await pc.addIceCandidate(c);
});

socket.on('next', ()=>{
  if(pc) pc.close();
  remoteVideo.srcObject=null;
  status.textContent="Buscando siguiente...";
});

document.getElementById('next').onclick = ()=>{
  if(pc) pc.close();
  remoteVideo.srcObject=null;
  status.textContent="Buscando siguiente...";
  socket.emit('next');
};

document.getElementById('stop').onclick = ()=>{ location.reload(); };

init();
</script>
</body>
</html>
