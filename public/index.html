<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conasup</title>
<style>body{margin:0;background:#000;color:#fff;font-family:sans-serif;text-align:center}video{width:100%;height:45vh;background:#111;object-fit:cover}button{padding:15px 30px;margin:10px;background:#8a2be2;color:#fff;border:0;border-radius:10px;font-size:18px}</style>
</head><body>
<div id="s">Cargando camara...</div>
<video id="me" autoplay muted playsinline></video>
<video id="you" autoplay playsinline></video>
<br><button id="next">SIGUIENTE >></button>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const s = document.getElementById('s');
const me = document.getElementById('me');
const you = document.getElementById('you');
let pc, stream;
(async()=>{
  stream = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  me.srcObject = stream;
  s.textContent = 'Buscando...';
  socket.emit('ready');
})();
function newPC(){
  if(pc) pc.close();
  pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  pc.ontrack = e => you.srcObject = e.streams[0];
  pc.onicecandidate = e => e.candidate && socket.emit('ice', e.candidate);
}
socket.on('searching',()=>{ s.textContent='Buscando...'; you.srcObject=null; });
socket.on('matched', async(d)=>{
  newPC(); s.textContent='Conectado!';
  if(d.initiator){
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    socket.emit('offer', offer);
  }
});
socket.on('offer', async(o)=>{
  newPC();
  await pc.setRemoteDescription(o);
  const ans = await pc.createAnswer();
  await pc.setLocalDescription(ans);
  socket.emit('answer', ans);
  s.textContent='Conectado!';
});
socket.on('answer', async(a)=>{ await pc.setRemoteDescription(a); });
socket.on('ice', async(c)=>{ try{await pc.addIceCandidate(c)}catch(e){} });
socket.on('partner-left',()=>{
  s.textContent='Se fue, buscando otro...';
  you.srcObject=null;
  socket.emit('ready');
});
document.getElementById('next').onclick=()=>{
  you.srcObject=null;
  s.textContent='Buscando siguiente...';
  if(pc) pc.close();
  socket.emit('next');
};
</script></body></html>
